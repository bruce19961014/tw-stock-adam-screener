<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONDS Pro | 量化交易終端</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root { --bg: #030508; --card: #0d1117; --neon: #00f2fe; --text: #e6edf3; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
        .sidebar { width: 280px; position: fixed; height: 100vh; background: #010409; border-right: 1px solid #30363d; padding: 2rem; }
        .main { margin-left: 280px; padding: 3rem; }
        .card-stat { background: var(--card); border: 1px solid #30363d; border-radius: 12px; padding: 1.5rem; transition: 0.3s; }
        .card-stat:hover { border-color: var(--neon); }
        .nav-link { color: #8b949e; cursor: pointer; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .nav-link:hover, .nav-link.active { background: rgba(0, 242, 254, 0.1); color: var(--neon); }
        .search-box { background: #010409; border: 1px solid #30363d; color: white; border-radius: 8px; padding: 10px; width: 100%; margin-bottom: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3 class="fw-bold text-info mb-5">ONDS <span class="text-white">PRO</span></h3>
    <div class="nav flex-column">
        <div class="nav-link active" onclick="switchTab('dashboard')"><i class="bi bi-cpu me-2"></i> 指揮中心</div>
        <div class="nav-link" onclick="switchTab('screener')"><i class="bi bi-search me-2"></i> 200大選股</div>
        <div class="nav-link" onclick="switchTab('risk')"><i class="bi bi-shield-exclamation me-2"></i> 壓力測試</div>
    </div>
    <div class="mt-auto pt-5 border-top border-secondary">
        <small class="text-secondary">Last Update:</small><br>
        <small id="update-time" class="text-info">Loading...</small>
    </div>
</div>

<div class="main">
    <div id="dashboard" class="tab-content active">
        <h2 class="mb-4">📊 宏觀戰情總覽</h2>
        <div class="row g-4 mb-5" id="market-cards">
            </div>
        <div class="card-stat">
            <h5>🤖 AI 深度輿情分析</h5>
            <p id="sentiment-summary" class="text-secondary mt-3"></p>
            <div id="hot-tags"></div>
        </div>
    </div>

    <div id="screener" class="tab-content">
        <h2 class="mb-4">🔍 權值股監控矩陣</h2>
        <input type="text" id="search" class="search-box" placeholder="搜尋代號或名稱...">
        <div class="card-stat">
            <table class="table table-dark table-hover">
                <thead>
                    <tr><th>代號</th><th>現價</th><th>乖離% (20MA)</th><th>高點回撤%</th><th>風險</th><th>狀態</th></tr>
                </thead>
                <tbody id="stock-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let rawData = {};

    async function fetchData() {
        const res = await fetch('data.json');
        rawData = await res.json();
        render();
    }

    function render() {
        document.getElementById('update-time').innerText = rawData.update_time;
        
        // 渲染儀表板卡片
        const m = rawData.market;
        document.getElementById('market-cards').innerHTML = `
            <div class="col-md-3"><div class="card-stat"><small>加權指數</small><h3>${m.index}</h3><span class="${m.change > 0 ? 'text-danger' : 'text-success'}">${m.change}</span></div></div>
            <div class="col-md-3"><div class="card-stat"><small>外資期指淨空</small><h3 class="text-danger">${m.txf_net}</h3></div></div>
            <div class="col-md-3"><div class="card-stat"><small>恐慌指數 VIX</small><h3 class="text-warning">${m.vix}</h3></div></div>
            <div class="col-md-3"><div class="card-stat"><small>全市場融資</small><h3 class="text-info">${m.margin_bal}億</h3></div></div>
        `;

        document.getElementById('sentiment-summary').innerText = rawData.sentiment.summary;

        // 渲染選股表格
        const tbody = document.getElementById('stock-body');
        tbody.innerHTML = rawData.stocks.map(s => `
            <tr>
                <td class="text-info fw-bold">${s.id}</td>
                <td>${s.p}</td>
                <td class="${s.bias > 0 ? 'text-danger' : 'text-success'}">${s.bias}%</td>
                <td>${s.drawdown}%</td>
                <td><span class="badge ${s.risk.includes('高') ? 'bg-danger' : 'bg-success'}">${s.risk}</span></td>
                <td>${s.vol}</td>
            </tr>
        `).join('');
    }

    function switchTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // 搜尋功能
    document.getElementById('search').addEventListener('keyup', function(e) {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('#stock-body tr').forEach(tr => {
            tr.style.display = tr.innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    });

    fetchData();
</script>
</body>
</html>
