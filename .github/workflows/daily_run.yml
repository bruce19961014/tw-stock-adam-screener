name: Daily Stock Screener

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run screener
        run: |
          python screener.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 強制讓本地與遠端同步
          git fetch --all
          git reset --hard origin/main
          
          # 2. 重新執行一次 Python，確保 index.html 是最新產生的
          python screener.py
          
          # 3. 強制推送到 GitHub
          git add index.html
          git commit -m "Update stock list: $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push -f origin main
